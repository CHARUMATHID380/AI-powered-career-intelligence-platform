services:
  - type: web
    name: careercast
    env: python
    region: singapore   # closest to India
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn dev_server:app --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
